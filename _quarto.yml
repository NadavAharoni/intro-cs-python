# Defaults for rendering the .md files in this repo with Quarto.
# Render one file:  quarto render exercises.md
# The files keep the .md suffix so they also read well on GitHub.
project:
  type: default

# Hebrew, right to left.
lang: he
dir: rtl

# Keep quotes as typed: smart quotes are wrong in Hebrew.
from: markdown-smart

format:
  html:
    embed-resources: true
    toc: true
    toc-depth: 3
    number-sections: false
    # Code stays left to right inside the RTL page (GitHub does this by itself).
    include-in-header:
      text: |
        <style>
          pre, pre code { direction: ltr; text-align: left; }
          code { direction: ltr; unicode-bidi: isolate; }
        </style>
